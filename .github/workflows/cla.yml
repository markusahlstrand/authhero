name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Contributors sign once by commenting the sign phrase on their PR; signatures are
# stored on the `cla-signatures` branch of this repo. See CLA.md / CONTRIBUTING.md.
#
# pull_request_target is safe here: no step checks out or executes PR content —
# the action only calls the GitHub API. These permissions are the action's
# documented minimum for same-repo signature storage:
permissions:
  actions: write # re-run the CLA check after a signature comment
  contents: write # write signatures to the cla-signatures branch ('read' only works with remote storage)
  pull-requests: write # post/update the signing comment on PRs
  statuses: write # set the CLA commit status

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Upstream repo is archived (read-only) but its releases remain functional; no
      # widely-adopted maintained fork exists yet. Pinned to the v2.6.1 commit SHA.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/markusahlstrand/authhero/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "markusahlstrand,dependabot[bot],github-actions[bot],copilot-swe-agent[bot]"
