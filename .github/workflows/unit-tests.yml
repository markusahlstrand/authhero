# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Unit tests

on: pull_request

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input — pnpm/action-setup v4+ reads the packageManager
      # field from package.json. A pinned older pnpm (8) can't read the
      # lockfileVersion 9 lockfile, silently ignores it, and fresh-resolves
      # into whatever the registry serves (e.g. a broken upstream release).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}

      # Restore TypeScript's incremental output (`.tsbuildinfo`) and the
      # `dist/types/` per-file `.d.ts` tree that `rollup-plugin-dts` bundles.
      # On a cache hit, `tsc -p tsconfig.types.json` skips type-checking and
      # re-emit for unchanged files, dropping authhero's cold build from
      # ~21 s to ~11 s. Cache must include both: tsbuildinfo alone gives no
      # speedup because tsc still re-emits when the `.d.ts` files are absent.
      - name: Restore TypeScript build cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/tsconfig.tsbuildinfo
            packages/authhero/dist/tsconfig.types.tsbuildinfo
            packages/authhero/dist/types
          key: ${{ runner.os }}-ts-${{ hashFiles('packages/*/tsconfig*.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ts-${{ hashFiles('packages/*/tsconfig*.json', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-ts-

      - name: Build packages
        # pnpm -r builds in topological dependency order, so each package's
        # dist/*.d.ts exist before dependents type-check against them. Covers
        # interfaces, saml, proxy, kysely, widget, authhero, drizzle,
        # multi-tenancy, cloudflare, aws and create-authhero.
        run: pnpm -r --filter './packages/**' build

      - name: Build admin
        run: pnpm admin build

      # Validate the shape of what we publish, not just what compiles from
      # source. publint reads the packed manifest: it catches a "types"
      # condition ordered after "import"/"require" (TypeScript resolves
      # conditions in order, so it silently finds no types) and exports
      # pointing at files absent from the tarball.
      - name: Check package manifests (publint)
        run: |
          set -e
          for p in packages/adapter-interfaces packages/authhero packages/aws \
                   packages/cloudflare packages/create-authhero packages/drizzle \
                   packages/kysely packages/multi-tenancy packages/proxy \
                   packages/saml packages/ui-widget apps/admin; do
            echo "::group::publint $p"
            (cd "$p" && pnpm dlx publint)
            echo "::endgroup::"
          done

      # attw resolves each entrypoint the way a consumer's TypeScript would.
      #
      # Two known-issue filters, both deliberate:
      #   false-cjs — systemic. Every package ships a single .d.ts next to an
      #     .mjs, so ESM consumers get CJS-flavoured types. Fixing it means
      #     emitting .d.mts/.d.cts from every build; tracked separately.
      #   ui-widget — excluded entirely. Stencil emits ESM into .js files with
      #     no "type": "module", tripping UnexpectedModuleSyntax on every
      #     entrypoint. That is a Stencil build concern, not a manifest one.
      #
      # authhero/styles is a stylesheet, so it has no types to resolve.
      - name: Check published types (arethetypeswrong)
        run: |
          set -e
          for p in packages/adapter-interfaces packages/authhero packages/aws \
                   packages/cloudflare packages/drizzle packages/kysely \
                   packages/multi-tenancy packages/proxy packages/saml apps/admin; do
            extra=""
            if [ "$p" = "packages/authhero" ]; then
              extra="--exclude-entrypoints styles"
            fi
            echo "::group::attw $p"
            (cd "$p" && pnpm dlx @arethetypeswrong/cli --pack . \
              --profile node16 --ignore-rules false-cjs $extra)
            echo "::endgroup::"
          done

      # Scaffold each template from packed tarballs, outside the workspace, and
      # type-check it. The --workspace smoke tests below cannot catch a bad peer
      # range, an empty tarball, or a missing .d.ts, because workspace links and
      # esbuild bundling hide all three. See the script header.
      - name: Verify templates install from packed tarballs
        run: node scripts/scaffold-from-tarballs.mjs

      # Smoke-test the Cloudflare Workers deployment path: scaffold a fresh
      # multi-tenant project via create-authhero, then run `wrangler deploy
      # --dry-run` against it. Catches drift between published packages
      # (drizzle adapter, widget, admin, authhero core) before users hit it.
      - name: Scaffold cloudflare worker
        working-directory: apps
        run: |
          node ../packages/create-authhero/index.js worker-smoke \
            --template=cloudflare \
            --workspace --multi-tenant --admin-ui \
            --skip-install --skip-migrate --skip-start --yes

      - name: Link workspace deps for scaffolded worker
        run: pnpm install --no-frozen-lockfile

      - name: Validate worker bundles
        working-directory: apps/worker-smoke
        run: pnpm exec wrangler deploy --dry-run --outdir=/tmp/worker-out

      # Smoke-test the WFP dispatcher template (#902) — scaffold the
      # dispatcher worker and dry-run deploy. The dispatcher only depends on
      # @authhero/proxy and @authhero/drizzle, both already built above.
      - name: Scaffold WFP dispatcher
        working-directory: apps
        run: |
          node ../packages/create-authhero/index.js wfp-dispatcher-smoke \
            --template=cloudflare-wfp-dispatcher \
            --workspace \
            --skip-install --skip-migrate --skip-start --yes

      - name: Link workspace deps for WFP dispatcher
        run: pnpm install --no-frozen-lockfile

      - name: Validate WFP dispatcher bundles
        working-directory: apps/wfp-dispatcher-smoke
        run: pnpm exec wrangler deploy --dry-run --outdir=/tmp/wfp-out

      - name: Run tests
        run: pnpm -r test
